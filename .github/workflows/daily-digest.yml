name: Manual Daily Digest

on:
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: [self-hosted, Linux, ARM64]
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # self-hosted runner의 ignored archive/ DB를 보존합니다.
          clean: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r content-crawler/requirements.txt
      
      - name: Run anniversary digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content-crawler/run_anniversary_digest.py
        timeout-minutes: 5
