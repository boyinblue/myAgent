name: Manual Daily Digest

on:
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: [self-hosted, Linux, ARM64]
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # self-hosted runner의 ignored archive/ DB를 보존합니다.
          clean: false
      
      - name: Prepare Python environment
        run: |
          if [[ ! -x .venv/bin/python ]]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install -r content-crawler/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      
      - name: Run anniversary digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python content-crawler/run_anniversary_digest.py
        timeout-minutes: 5
