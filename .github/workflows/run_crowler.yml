name: Manual Content Archive

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      url:
        description: '추가할 콘텐츠 URL (비어있으면 전체 크롤링)'
        required: false
        default: ''

jobs:
  archive:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell   # 👈 윈도우 기본 PowerShell 사용 (경로 충돌 방지)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r content-crawler/requirements.txt

      - name: Run Archive Manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          $targetUrl = "${{ github.event.inputs.url }}"
          if (-not [string]::IsNullOrEmpty($targetUrl)) {
              Write-Host "[*] 단건 URL 크롤링: $targetUrl"
              python content-crawler/main.py --url "$targetUrl"
          } else {
              Write-Host "[*] 전체 크롤링 실행"
              python content-crawler/main.py
          }

      - name: Commit and Push DB changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          $status = git status --porcelain archive/archive_index.db
          if (-not $status) {
              Write-Host "No changes to commit"
              exit 0
          }

          git add archive/archive_index.db
          git commit -m "ci: use self-hosted runner"
          git push

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $token = $env:TELEGRAM_BOT_TOKEN
          $chatId = $env:TELEGRAM_CHAT_ID
          $urlInput = "${{ github.event.inputs.url }}"
          $workflowName = "${{ github.workflow }}"
          $serverUrl = "${{ github.server_url }}"
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          
          $message = "✅ 콘텐츠 아카이브 추가 완료`n`n🔗 URL: $urlInput`n📦 Workflow: $workflowName`n🚀 Run: $serverUrl/$repo/actions/runs/$runId"
          
          try {
              Invoke-RestMethod -Uri "https://api.telegram.org/bot${token}/sendMessage" -Method Post -Body @{
                  chat_id = $chatId
                  text = $message
                  parse_mode = "HTML"
              }
          } catch {
              Write-Host "Telegram notification failed (non-blocking)"
          }