name: Manual Content Archive

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      url:
        description: '추가할 콘텐츠 URL (비어있으면 전체 크롤링)'
        required: false
        default: ''

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r content-crawler/requirements.txt

      - name: Run Archive Manager
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "[*] 단건 URL 크롤링: ${{ github.event.inputs.url }}"
            python content-crawler/main.py --url "${{ github.event.inputs.url }}"
          else
            echo "[*] 전체 크롤링 실행"
            python content-crawler/main.py
          fi

      - name: Commit and Push DB changes
        working-directory: .
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- archive/archive_index.db; then
            echo "No changes to commit"
            exit 0
          fi

          git add archive/archive_index.db
          git commit -m "chore: update archive index DB [skip ci]"
          git push

      - name: Send Telegram Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ 콘텐츠 아카이브 추가 완료%0A%0A🔗 URL: ${{ github.event.inputs.url }}%0A📦 Workflow: ${{ github.workflow }}%0A🚀 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" || echo "Telegram notification failed (non-blocking)"